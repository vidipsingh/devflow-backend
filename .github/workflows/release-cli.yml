
name: Release DevFlow CLI

on:
  push:
    tags:
      - "v*.*.*"   # triggers on git tag like v1.0.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build CLI binaries & publish release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: devflow-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: devflow-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: devflow-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: devflow-darwin-arm64
          - goos: windows
            goarch: amd64
            asset_name: devflow-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o ${{ matrix.asset_name }} \
            ./cmd/cli/main.go

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
